services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ari-postgres
    environment:
      POSTGRES_USER: ari
      POSTGRES_PASSWORD: ari
      POSTGRES_DB: ari
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ari -d ari"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ari-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
